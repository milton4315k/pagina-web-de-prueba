// Para levantar Postgres localmente.
// Uso: docker compose up -d   y después   npm run migrate   &&   npm run seed

services:
  postgres:
    image: postgres:16-alpine
    container_name: nocturna-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nocturna
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d nocturna']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata: