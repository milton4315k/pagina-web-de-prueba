<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#171514" />
    <title>Entrar — Panel Nocturna Pizza</title>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="admin.css" />
  </head>
  <body>
    <main class="login">
      <div class="login__card">
        <p class="topbar__brand">NOCTURNA<small>PIZZA</small></p>
        <h1>Entrar al panel</h1>
        <p class="cell-muted">El acceso es con tu cuenta de Google autorizada.</p>

        <p class="error" data-login-error hidden></p>
        <p class="notice" data-login-status hidden></p>

        <button class="btn login__full" type="button" data-login-button>
          Entrar con Google
        </button>
        <button class="btn btn--ghost login__full" type="button" data-login-logout hidden>
          Cerrar sesión de Google
        </button>

        <p class="login__back"><a href="../index.html">← Volver al sitio</a></p>
      </div>
    </main>

    <script type="module" src="../js/admin/login.js"></script>
  </body>
</html>
