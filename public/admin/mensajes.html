<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#171514" />
    <title>Mensajes — Panel Nocturna Pizza</title>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="admin.css" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <p class="topbar__brand">NOCTURNA<small>PIZZA</small></p>
        <nav class="topbar__nav" aria-label="Panel">
          <a href="index.html">Pedidos</a>
          <a href="mensajes.html" aria-current="page">
            Mensajes <span class="badge" data-unread-badge hidden>0</span>
          </a>
          <a href="socios.html">Socios</a>
          <button class="btn btn--ghost btn--small" type="button" data-logout>Salir</button>
        </nav>
      </header>

      <h1>Mensajes</h1>
      <p class="cell-muted" style="margin-top: 0.35rem">
        Consultas que llegaron por el formulario de contacto. El cliente también abre WhatsApp
        al enviar el formulario: el mensaje queda acá por si no llegó.
      </p>

      <form class="toolbar" data-filters>
        <div class="field">
          <label for="filter-unread">Estado</label>
          <select id="filter-unread" name="unread">
            <option value="">Todos</option>
            <option value="true">Solo sin leer</option>
          </select>
        </div>
        <button class="btn" type="submit">Filtrar</button>
      </form>

      <p class="error" data-error hidden></p>

      <section class="panel">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th scope="col">Fecha</th>
                <th scope="col">Nombre</th>
                <th scope="col">Contacto</th>
                <th scope="col">Mensaje</th>
                <th scope="col">Estado</th>
              </tr>
            </thead>
            <tbody data-rows></tbody>
          </table>
        </div>
        <p class="empty" data-empty hidden>No hay mensajes con ese filtro.</p>
      </section>
    </div>

    <script type="module" src="../js/admin/mensajes.js"></script>
  </body>
</html>
